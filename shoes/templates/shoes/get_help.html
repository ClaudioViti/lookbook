{% load static %}
<link rel="icon" type="image/png" href="{% static 'favicon.svg' %}">
<link rel="apple-touch-icon-precomposed" href="{% static 'non2.png' %}"/>

<style>
  table {
  border-collapse:collapse
  }
  td, th {
  border:1px solid #ddd;
  padding:8px;
  }
  

  body {
margin: 0;
font-family: Arial, Helvetica, sans-serif;
}
.topnav {
overflow: hidden;
background-color: #333;
}

.topnav a {
float: left;
color: #f2f2f2;
text-align: center;
padding: 10px 10px;
text-decoration: none;
font-size: 10px;
}

.topnav a:hover {
background-color: #ddd;
color: black;
}

.topnav a.active {
background-color: #04AA6D;
color: white;
}
  </style>  

  <div class="topnav">
  <a style="cursor: pointer;" onclick="windowClose();" class="active">Close</a>

</div>

<a>Write your message here</a>
<form method="POST" style="margin-top:6px" action="{% url 'contact' %}">
    {% csrf_token %}
    <textarea style="width: 350px; height: 500px;" name="message" placeholder="text:"></textarea>
    <p><input style="display: inline-block; padding: 10px 14px; font-size: 11px; text-align: center; cursor: pointer; outline: none; color: #fff; background-color: #153b3b; border: none; border-radius: 7px; text-decoration: none;" type="submit" value="Send message" /> </p>
  </form>

  <script>
    function windowClose() {
    window.open('','_parent','');
    window.close();
    }
    </script>
